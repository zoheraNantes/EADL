global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: pushgateway          # résultats des pipelines de tests
    honor_labels: true
    static_configs: [{ targets: ["pushgateway:9091"] }]
  - job_name: minishop             # métriques de l'application (/metrics)
    static_configs: [{ targets: ["host.docker.internal:8000"] }]
