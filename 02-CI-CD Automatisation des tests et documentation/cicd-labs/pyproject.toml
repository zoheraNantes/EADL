[project]
name = "minishop"
version = "1.0.0"
description = "Application fil rouge — Formation CI/CD : automatisation des tests avec l'IA et documentation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: tests unitaires rapides",
  "api: tests d'API (TestClient ou serveur réel)",
  "e2e: tests de bout en bout navigateur (Playwright)",
  "visual: tests de régression visuelle",
  "generated: tests générés par IA (à relire !)",
  "slow: tests lents",
]

[tool.coverage.run]
source = ["minishop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"ai_tools/**" = ["S603", "S607", "S310", "S311", "S106", "E501", "B007"]
"scripts/**" = ["S311", "E501"]
"minishop/api.py" = ["S311"]
